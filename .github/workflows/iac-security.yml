name: IaC security gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned validators
        run: python -m pip install cfn-lint==1.58.0 checkov==3.3.30
      - name: Lint CloudFormation
        run: cfn-lint templates/*.yaml
      - name: Scan focused guardrails
        run: >-
          checkov --directory templates --framework cloudformation
          --check CKV_AWS_24,CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,CKV_AWS_56
          --compact
      - name: Compile Lambda handler
        run: python -m py_compile lambda/handler.py
      - name: Validate SCP artifact
        run: python scripts/validate_scp.py